name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev
      - run: make lint validate test
      - run: make replay schemas audit build
      - name: Ensure generated schemas are current
        run: git diff --exit-code -- schemas
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signalforge-replay
          path: reports/
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: signalforge:ci
